<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>תיק הקסם ✨ | זואי</title>
    <meta
      name="description"
      content="מכינות את תיק הקסם עם זואי — גוררות את הציוד לתיק, אוספות כוכבים וחוגגות כשהכול מוכן."
    />
    <meta name="theme-color" content="#9d73df" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2218%22%20fill%3D%22%239d73df%22%2F%3E%3Cpath%20d%3D%22m32%2010%206%2014%2016%202-12%2010%204%2016-14-8-14%208%204-16L10%2026l16-2z%22%20fill%3D%22%23fff1a5%22%2F%3E%3C%2Fsvg%3E"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }
      html {
        background: #fff8fd;
      }
      body {
        font-family: Arial, "Noto Sans Hebrew", sans-serif;
        padding: 16px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 16% 16%, #ffe3f1 0, transparent 35%),
          radial-gradient(circle at 84% 84%, #e7e0ff 0, transparent 36%),
          #fff8fd;
      }
      #game {
        width: 100%;
        height: calc(100svh - 112px);
        min-height: 620px;
        max-width: 1440px;
        margin: 0 auto;
        position: relative;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        border-radius: 28px;
        touch-action: none;
        box-shadow: 0 28px 80px rgba(83, 52, 103, 0.18);
      }
      [hidden] {
        display: none !important;
      }
      .packing-toolbar {
        max-width: 1440px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px 16px;
        color: #5f4976;
        font-size: 16px;
      }
      .packing-toolbar strong {
        font-size: 18px;
      }
      .packing-toolbar select {
        font: inherit;
        color: #5f4976;
        padding: 8px 12px;
        border-radius: 14px;
        border: 2px solid #c6b1e4;
        background: white;
        cursor: pointer;
      }
      .packing-toolbar select:focus-visible {
        outline: 3px solid #68439b;
        outline-offset: 3px;
      }
      .sound-test {
        width: 44px;
        height: 44px;
        border: 2px solid #c6b1e4;
        border-radius: 14px;
        background: #fff;
        font-size: 22px;
        cursor: pointer;
      }
      .sound-test:focus-visible {
        outline: 3px solid #68439b;
        outline-offset: 3px;
      }
      .end-time {
        background: #fff;
        border: 2px solid #e3d4ef;
        padding: 7px 12px;
        border-radius: 14px;
      }
      .end-time output {
        font-weight: bold;
        color: #51425f;
      }
      .item-button:focus,
      .keyboard-control:focus {
        outline: none;
      }
      .item-button:focus-visible {
        background: #f4eaff;
      }
      .packing-panel {
        position: absolute;
        min-height: 170px;
        overflow: visible;
        pointer-events: none;
      }
      .item-button {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 12px 16px;
        color: #51425f;
        background: white;
        border: 2px solid var(--item-border);
        border-radius: 28px;
        box-shadow: 0 8px 0 #513d5c0d;
        text-align: center;
        font: inherit;
        cursor: grab;
        user-select: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        transform: translateY(var(--deck-y, 0px)) scale(var(--deck-scale, 1));
        transform-origin: top center;
        pointer-events: none;
        transition:
          transform 220ms ease,
          box-shadow 220ms ease;
      }
      .item-button[data-deck-front="true"] {
        pointer-events: auto;
      }
      /* Keep the next card readable as soon as the front card is dragged away. */
      .item-button[data-deck-depth="2"] > * {
        visibility: hidden;
      }
      .item-subject {
        font-size: 14px;
        line-height: 1.4;
        color: #80698f;
      }
      .item-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        flex-shrink: 0;
        background: var(--item-tint);
        border-radius: 18px;
        font-size: 34px;
        line-height: 1;
      }
      .item-icon.has-image {
        width: 60px;
        height: 60px;
        padding: 4px;
      }
      .item-icon img {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 10px;
      }
      .item-icon.has-image img {
        display: block;
      }
      .item-label {
        font-size: 20px;
        font-weight: bold;
        line-height: 1.25;
      }
      .item-action {
        color: #80698f;
        font-size: 14px;
        line-height: 1.4;
      }
      .drag-preview {
        position: absolute;
        inset: auto;
        transform-origin: center;
        z-index: 5;
        pointer-events: none !important;
        transition: none;
        box-shadow: 0 12px 25px #513d5c26;
      }
      .drag-preview[aria-hidden="true"] > * {
        visibility: visible;
      }
      .jumping-star {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        user-select: none;
        font-size: var(--star-size);
        line-height: 1;
        filter: drop-shadow(0 5px 5px rgba(83, 52, 103, 0.2));
        animation: star-jump 710ms ease-out both;
      }
      @keyframes star-jump {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 1;
        }
        46% {
          transform: translate(-50%, calc(-50% - var(--star-mid))) scale(1.4)
            rotate(18deg);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, calc(-50% - var(--star-rise))) scale(1.4)
            rotate(18deg);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .item-button {
          transition: none;
        }
        .jumping-star {
          animation-duration: 200ms;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      #keyboard-controls {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
      }
      .keyboard-control {
        position: absolute;
        transform: translate(-50%, -50%);
        background: transparent;
        color: transparent;
        border: 0;
        border-radius: 26px;
        pointer-events: none;
      }
      .keyboard-control:focus-visible {
        background: rgba(255, 255, 255, 0.2);
      }
      #loading {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        color: #5f4976;
        text-align: center;
        font-size: 18px;
      }
      @media (max-width: 760px) {
        body {
          padding: 8px;
        }
        #game {
          height: max(calc(100svh - 112px), calc((100vw - 16px) * 1.904762));
        }
        canvas {
          border-radius: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="תיק הקסם">
      <h1 class="sr-only">משימת תיק הקסם עם זואי</h1>
      <div class="packing-toolbar">
        <select id="school-day" aria-label="יום הלימודים"></select>
        <button id="sound-test" class="sound-test" type="button" aria-label="בדיקת צליל" title="בדיקת צליל">🔊</button>
        <span class="end-time"
          >סיום הלימודים: <output id="end-time"></output
        ></span>
      </div>
      <audio id="packed-effect" preload="auto"></audio>
      <audio id="last-item-effect" preload="auto"></audio>
      <div id="game">
        <p id="loading" role="status">תיק הקסם נפתח… ✨</p>
        <div id="keyboard-controls"></div>
      </div>
      <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <noscript><p>כדי לשחק בתיק הקסם, יש להפעיל JavaScript בדפדפן.</p></noscript>

    <script
      src="%BASE_URL%magic-school-bag/vendor/phaser-4.2.1.min.js"
      onerror="
        document.getElementById('loading').textContent =
          'המשחק לא נטען. נסי לרענן את הדף.'
      "
    ></script>
    <script type="module" src="/src/magic-bag/main.ts"></script>
  </body>
</html>
